<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión | Dónde Ahorro</title>
    <style>
      :root {
        color-scheme: light dark;
        --wall: #e9edf0;
        --ink: #18212b;
        --muted: #5e6b78;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --wall: #12171c;
          --ink: #e8ecef;
          --muted: #a3adb7;
        }
      }
      body {
        margin: 0;
        background: var(--wall);
        color: var(--ink);
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 44rem;
        margin: 0 auto;
        padding: 3rem 1rem;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 2.25rem;
        line-height: 1.1;
      }
      p {
        color: var(--muted);
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>No hay internet y esta página no se guardó en tu dispositivo. Las que ya abriste se pueden ver sin conexión, con los precios de ese momento.</p>
      <p><a href="/">Probar de nuevo</a></p>
    </main>
  </body>
</html>
