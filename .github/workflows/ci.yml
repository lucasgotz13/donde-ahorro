name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: donde_ahorro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The db integration tests and the E2E seed create their own databases on this server.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/donde_ahorro
    steps:
      - uses: actions/checkout@v5
      # Until the app's code lands on main, a run with no package.json has nothing to check.
      - id: code
        run: echo "present=${{ hashFiles('package.json') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.code.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.code.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.code.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.code.outputs.present == 'true'
        run: pnpm typecheck
      - if: steps.code.outputs.present == 'true'
        run: pnpm test
      - if: steps.code.outputs.present == 'true' && hashFiles('apps/web/playwright.config.ts') != ''
        run: pnpm --filter @donde-ahorro/web exec playwright install --with-deps chromium
      - if: steps.code.outputs.present == 'true' && hashFiles('apps/web/playwright.config.ts') != ''
        run: pnpm test:e2e
